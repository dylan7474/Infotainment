<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CarStereo Cosmic Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #a5f3fc;
            --neon-glow: #22d3ee;
            --panel-bg: #1e1b1e;
            --wood-trim: #3b2417;
        }

        body {
            background: radial-gradient(circle, #2d3748 0%, #0a0c10 100%);
            font-family: 'Orbitron', sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Main Chassis */
        .chassis {
            background: linear-gradient(145deg, #4a5568, #1a202c);
            padding: 20px;
            border-radius: 40px;
            border: 8px solid var(--wood-trim);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.1);
            width: 100%;
            max-width: 500px;
        }

        /* Top Marquee Display */
        .marquee-display {
            background: #000;
            border: 3px solid #4a5568;
            border-radius: 10px;
            padding: 10px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-glow);
            font-size: 0.75rem;
            text-align: center;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* Circular Neon Buttons */
        .neon-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--neon-blue);
            background: rgba(165, 243, 252, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.2);
            cursor: pointer;
        }

        .neon-circle:active, .preset-active {
            background: rgba(34, 211, 238, 0.3);
            box-shadow: 0 0 20px var(--neon-glow), inset 0 0 10px var(--neon-glow);
            transform: scale(0.95);
        }

        .neon-circle span {
            font-size: 0.6rem;
            font-weight: bold;
            text-align: center;
            padding: 0 5px;
            margin-top: 4px;
        }

        /* Vertical Mixer Slider */
        .vertical-slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 15px 5px;
            height: 220px;
        }

        input[type=range].vertical-slider {
            writing-mode: bt-lr; /* IE */
            appearance: slider-vertical;
            width: 8px;
            height: 160px;
            padding: 0 5px;
        }

        /* Modal / Library Styling */
        .modal {
            background: rgba(10, 12, 16, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

<div class="chassis">
    <div class="marquee-display" id="display-title">
        READY TO CONNECT / SLEEP OFF
    </div>

    <div class="flex gap-6">
        <div class="grid grid-cols-2 gap-6 flex-1">
            <button onpointerdown="handlePresetStart(1)" onpointerup="handlePresetEnd(1)" class="neon-circle" id="btn-1">
                <div class="text-xl">🚀</div><span id="label-1">P1</span>
            </button>
            <button onpointerdown="handlePresetStart(2)" onpointerup="handlePresetEnd(2)" class="neon-circle" id="btn-2">
                <div class="text-xl">🌀</div><span id="label-2">P2</span>
            </button>
            <button onpointerdown="handlePresetStart(3)" onpointerup="handlePresetEnd(3)" class="neon-circle" id="btn-3">
                <div class="text-xl">🔫</div><span id="label-3">P3</span>
            </button>
            <button onpointerdown="handlePresetStart(4)" onpointerup="handlePresetEnd(4)" class="neon-circle" id="btn-4">
                <div class="text-xl">⚡</div><span id="label-4">P4</span>
            </button>
            <button onpointerdown="handlePresetStart(5)" onpointerup="handlePresetEnd(5)" class="neon-circle" id="btn-5">
                <div class="text-xl">🪐</div><span id="label-5">P5</span>
            </button>
            <button onpointerdown="handlePresetStart(6)" onpointerup="handlePresetEnd(6)" class="neon-circle" id="btn-6">
                <div class="text-xl">📡</div><span id="label-6">P6</span>
            </button>
        </div>

        <div class="flex flex-col gap-4">
            <div class="vertical-slider-container">
                <span class="text-[8px] mb-2">+</span>
                <input type="range" id="noise-balance" class="vertical-slider" min="0" max="1" step="0.01" value="0.33">
                <span class="text-[8px] mt-2">-</span>
                <span class="text-[7px] mt-2 rotate-90">MIX</span>
            </div>
            <button onclick="toggleView('library')" class="bg-cyan-500 text-black text-[10px] font-bold py-2 rounded-lg">LIB</button>
        </div>
    </div>

    <div class="mt-8 flex justify-between items-center px-2">
        <div class="flex gap-2">
            <button onclick="smartSeek(-15)" class="text-xl opacity-50 hover:opacity-100">⏮</button>
            <button onclick="togglePlay()" class="text-xl opacity-50 hover:opacity-100">⏯</button>
            <button onclick="smartSeek(30)" class="text-xl opacity-50 hover:opacity-100">⏭</button>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleNoise()" id="noise-toggle" class="text-[9px] border border-cyan-500/30 px-2 py-1 rounded">NOISE OFF</button>
            <button onclick="setSleepTimer(15)" class="text-[9px] border border-cyan-500/30 px-2 py-1 rounded">15M</button>
        </div>
    </div>
</div>

<div id="overlay-library" class="modal fixed inset-0 z-50 p-6 hidden flex flex-col">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-2xl font-bold">COSMIC EXPLORER</h2>
        <button onclick="toggleView('player')" class="px-4 py-2 bg-red-500/20 text-red-500 rounded-xl font-bold">EXIT</button>
    </div>
    <input type="text" id="lib-search" oninput="renderLibrary()" placeholder="Search transmissions..." class="bg-white/5 border border-white/10 p-4 rounded-xl mb-6 outline-none">
    <div id="library-content" class="flex-1 overflow-y-auto space-y-4"></div>
</div>

<audio id="audio-player" class="hidden"></audio>

</body>
</html>
